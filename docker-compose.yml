services:
  db:
    image: postgres:16
    container_name: abrechnung-db
    environment:
      POSTGRES_USER: abrechnung
      POSTGRES_PASSWORD: abrechnung
      POSTGRES_DB: abrechnung
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abrechnung"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
