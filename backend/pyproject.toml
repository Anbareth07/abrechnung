[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abrechnung-backend"
version = "0.1.0"
description = "Nebenkostenabrechnung Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # bewusst ohne [standard]: uvloop/httptools haben auf ARMv7 keine Wheels
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pypdf>=4.0",
]
# PostgreSQL-Treiber nur bei Bedarf (SQLite ist Default in den Containern).
# Hinweis: psycopg-binary hat KEINE ARMv7-Wheels -> auf Raspberry Pi (32-bit)
# bewusst nicht installieren.
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
